# 운영 배포는 deploy/deploy.sh(무중단: 백엔드를 하나씩 교체, Caddy는 reload)
# oracle 서버(NPMplus 뒤)에서는 docker-compose.oracle.yml을 덧붙인다(Jenkinsfile 참고).
# 자원 예산: daypage 전체 2 CPU / 약 2.9 GB(oracle의 다른 서비스와 함께 쓴다). 서비스마다 cpus·mem_limit으로 나눈다.
x-backend: &backend
  # 네 서비스가 같은 이미지를 쓴다. backend만 빌드하고 나머지는 이 태그를 그대로 쓴다.
  image: daypage-backend:latest
  build: ./backend
  env_file: ${ENV_FILE:-.env}
  environment:
    DJANGO_DEBUG: "false"
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  # Caddy는 공식 이미지로 계속 떠 있다. 정적 파일은 web_static 볼륨(배포 때 web-dist가 채움),
  # 설정은 저장소의 Caddyfile을 그대로 읽고 배포 때 reload한다. 그래서 배포해도 Caddy를 내리지 않는다.
  web:
    image: caddy:2-alpine
    cpus: "0.2"
    mem_limit: 128m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-daypage.sandcorp.co.kr}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - web_static:/srv
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - backend2
    restart: unless-stopped

  # 프론트 빌드 결과를 web_static에 넣고 끝나는 일회성 작업(deploy/publish-static.sh).
  # 평소 `up`에는 뜨지 않고 배포 스크립트가 `--profile deploy run`으로 부른다.
  web-dist:
    image: daypage-web-dist:latest
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    profiles: ["deploy"]
    volumes:
      - web_static:/srv
    restart: "no"

  # 백엔드는 단일 프로세스 uvicorn을 CPU 수만큼(지금 2개) 띄운다. Caddy가 웹소켓을 노트 경로로
  # 나눠(uri_hash) 같은 장의 연결이 한 프로세스에 모이고, 방 안 전달은 메모리에서 끝난다(daypage/hub.py).
  # 늘리려면 backend3…을 같은 모양으로 더하고 deploy/Caddyfile의 upstream 목록에도 넣는다.
  # 명령은 한 줄로 쓴다. YAML 접힘(>)에서 더 들여 쓴 줄은 줄바꿈이 남아 첫 줄만 실행됐었다.
  backend:
    <<: *backend
    # 수용 인원은 이 CPU 제한에서 계산한다(daypage/admission.py). 백엔드를 늘리면 같은 제한을 함께 준다.
    cpus: "0.65"
    mem_limit: 768m
    # migrate는 배포 스크립트가 먼저 따로 돌린다(deploy/deploy.sh). 여기서는 받기만 한다.
    # 내릴 때(SIGTERM) 새 연결을 받지 않고 열린 연결을 정리할 시간을 준다. 그동안 Caddy가 다른 쪽으로 보낸다.
    command: &backend-command ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*", "--timeout-graceful-shutdown", "10"]
    stop_grace_period: 20s
    # 소켓이 열린 것만이 아니라 Django가 실제로 답하는지 본다(ALLOWED_HOSTS의 첫 도메인을 Host로 보낸다).
    healthcheck: &backend-health
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as u; h = os.environ.get('DJANGO_ALLOWED_HOSTS', 'localhost').split(',')[0]; u.urlopen(u.Request('http://127.0.0.1:8000/api/health', headers={'Host': h}), timeout=2)"
      interval: 3s
      retries: 40

  backend2:
    <<: *backend
    cpus: "0.65"
    mem_limit: 768m
    command: *backend-command
    stop_grace_period: 20s
    healthcheck: *backend-health
    # 처음 띄울 때 backend가 먼저 받기 시작한 뒤에 뜬다(배포 때는 deploy.sh가 하나씩 바꾼다).
    depends_on:
      backend:
        condition: service_healthy

  worker:
    <<: *backend
    cpus: "0.03"
    mem_limit: 256m
    command: celery -A config worker -l info --concurrency 2

  beat:
    <<: *backend
    cpus: "0.02"
    mem_limit: 128m
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  postgres:
    image: postgres:17-alpine
    cpus: "0.35"
    mem_limit: 768m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daypage}
      POSTGRES_USER: ${POSTGRES_USER:-daypage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-daypage}"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    cpus: "0.1"
    mem_limit: 128m
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  web_static:
