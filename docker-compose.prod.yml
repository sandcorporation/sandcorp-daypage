# 운영 배포: docker compose -f docker-compose.prod.yml build backend web && docker compose -f docker-compose.prod.yml up -d
# oracle 서버(NPMplus 뒤)에서는 docker-compose.oracle.yml을 덧붙인다(Jenkinsfile 참고).
# 자원 예산: daypage 전체 2 CPU / 약 2.9 GB(oracle의 다른 서비스와 함께 쓴다). 서비스마다 cpus·mem_limit으로 나눈다.
x-backend: &backend
  # 네 서비스가 같은 이미지를 쓴다. backend만 빌드하고 나머지는 이 태그를 그대로 쓴다.
  image: daypage-backend:latest
  build: ./backend
  env_file: ${ENV_FILE:-.env}
  environment:
    DJANGO_DEBUG: "false"
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    cpus: "0.2"
    mem_limit: 128m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-daypage.sandcorp.co.kr}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - backend2
    restart: unless-stopped

  # 백엔드는 단일 프로세스 uvicorn을 CPU 수만큼(지금 2개) 띄운다. Caddy가 웹소켓을 노트 경로로
  # 나눠(uri_hash) 같은 장의 연결이 한 프로세스에 모이고, 방 안 전달은 메모리에서 끝난다(daypage/hub.py).
  # 늘리려면 backend3…을 같은 모양으로 더하고 deploy/Caddyfile의 upstream 목록에도 넣는다.
  # 명령은 한 줄로 쓴다. YAML 접힘(>)에서 더 들여 쓴 줄은 줄바꿈이 남아 첫 줄만 실행됐었다.
  backend:
    <<: *backend
    # 수용 인원은 이 CPU 제한에서 계산한다(daypage/admission.py). 백엔드를 늘리면 같은 제한을 함께 준다.
    cpus: "0.65"
    mem_limit: 768m
    command:
      - sh
      - -c
      - "python manage.py migrate --noinput && exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips '*'"
    healthcheck: &backend-health
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 3s
      retries: 40

  backend2:
    <<: *backend
    cpus: "0.65"
    mem_limit: 768m
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck: *backend-health
    # migrate는 backend가 한다. 끝나고 받기 시작한 뒤에 뜬다.
    depends_on:
      backend:
        condition: service_healthy

  worker:
    <<: *backend
    cpus: "0.03"
    mem_limit: 256m
    command: celery -A config worker -l info --concurrency 2

  beat:
    <<: *backend
    cpus: "0.02"
    mem_limit: 128m
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  postgres:
    image: postgres:17-alpine
    cpus: "0.35"
    mem_limit: 768m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daypage}
      POSTGRES_USER: ${POSTGRES_USER:-daypage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-daypage}"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    cpus: "0.1"
    mem_limit: 128m
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
