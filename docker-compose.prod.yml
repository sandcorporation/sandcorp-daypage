# 운영 배포: docker compose -f docker-compose.prod.yml build backend web && docker compose -f docker-compose.prod.yml up -d
# sub 서버(NPMplus 뒤)에서는 docker-compose.sub.yml을 덧붙인다(Jenkinsfile 참고).
x-backend: &backend
  # 네 서비스가 같은 이미지를 쓴다. backend만 빌드하고 나머지는 이 태그를 그대로 쓴다.
  image: daypage-backend:latest
  build: ./backend
  env_file: ${ENV_FILE:-.env}
  environment:
    DJANGO_DEBUG: "false"
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-daypage.sandcorp.co.kr}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    <<: *backend
    # 웹소켓 메시지는 Redis 채널 레이어로 워커 사이에 오가므로 CPU 수만큼 워커를 둘 수 있다.
    # 한 줄로 쓴다. YAML 접힘(>)에서 더 들여 쓴 줄은 줄바꿈이 남아, 첫 줄만 실행되고
    # --workers·--proxy-headers가 빠졌었다.
    command:
      - sh
      - -c
      - "python manage.py migrate --noinput && exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers $${UVICORN_WORKERS:-2} --proxy-headers --forwarded-allow-ips '*'"

  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency 2

  beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daypage}
      POSTGRES_USER: ${POSTGRES_USER:-daypage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-daypage}"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
