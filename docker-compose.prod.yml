# 운영 배포는 deploy/deploy.sh(무중단: 백엔드를 하나씩 교체, Caddy는 reload)
# oracle 서버(NPMplus 뒤)에서는 docker-compose.oracle.yml을 덧붙인다(Jenkinsfile 참고).
# 자원 예산: daypage 전체 약 3.1 CPU / 약 4.4 GB(oracle 4코어·23 GB를 다른 서비스와 함께 쓴다). 백엔드 하나에 1 CPU를 주고 나머지는 그 비율로 나눈다.
x-backend: &backend
  # 네 서비스가 같은 이미지를 쓴다. Jenkins는 DAYPAGE_BACKEND_IMAGE=ghcr…:<sha>를 줘서 oracle이 pull만 한다(#99).
  # 변수가 없으면(make prod-local 등) 로컬에서 backend만 빌드하고 나머지는 이 태그를 그대로 쓴다.
  image: ${DAYPAGE_BACKEND_IMAGE:-daypage-backend:latest}
  build: ./backend
  env_file: ${ENV_FILE:-.env}
  environment:
    DJANGO_DEBUG: "false"
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
    # glibc가 스레드마다 힙(arena)을 따로 만들어 놓은 메모리가 흩어진 채 남는 것을 줄인다(daypage/memory.py 참고)
    MALLOC_ARENA_MAX: "2"
    # 큰 덩어리(장 문서·동기화 버퍼, 128KB 넘음)는 늘 따로 받아 놓자마자 돌려주고, 힙 꼭대기가 128KB 넘게 비면 바로 줄인다.
    # (기본값은 큰 덩어리를 몇 번 놓으면 기준을 올려 힙에 남겼다. 큰 장을 되풀이해 열고 닫는 시험에서 힙 82→43MB)
    GLIBC_TUNABLES: "glibc.malloc.mmap_threshold=131072:glibc.malloc.trim_threshold=131072"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  # Caddy는 공식 이미지로 계속 떠 있다. 정적 파일은 web_static 볼륨(배포 때 web-dist가 채움),
  # 설정은 caddy_etc 볼륨(배포 때 web-dist가 저장소의 Caddyfile을 넣음)에서 읽고 reload한다. 그래서 배포해도 Caddy를 내리지 않는다.
  web:
    # 버전을 고정한다. 태그가 움직이면 모르는 사이 새 이미지로 Caddy가 다시 만들어져 끊긴다.
    # 올릴 때는 이 줄을 바꾸고, 그 배포에서만 Caddy가 몇 초 다시 뜬다.
    image: caddy:2.11.7-alpine
    cpus: "0.3"
    mem_limit: 192m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-daypage.sandcorp.co.kr}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - web_static:/srv
      # 설정 파일도 볼륨으로 받는다(web-dist가 채움). Jenkins가 컨테이너 안에서 돌아 저장소 경로를 호스트에서 연결할 수 없다.
      - caddy_etc:/etc/caddy
    depends_on:
      - backend
      - backend2
    restart: unless-stopped

  # 프론트 빌드 결과를 web_static에 넣고 끝나는 일회성 작업(deploy/publish-static.sh).
  # 평소 `up`에는 뜨지 않고 배포 스크립트가 `--profile deploy run`으로 부른다.
  web-dist:
    image: ${DAYPAGE_WEB_DIST_IMAGE:-daypage-web-dist:latest}
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      # 메트릭 스니펫 주소(#51)는 빌드가 아니라 배포 때 index.html에 넣는다(deploy/publish-static.sh). 이미지를 oracle 밖에서 굽기 때문이다(#99).
      VITE_METRICS_SNIPPET_URL: ${VITE_METRICS_SNIPPET_URL:-}
    profiles: ["deploy"]
    volumes:
      - web_static:/srv
      - caddy_etc:/caddy-etc
    restart: "no"

  # 백엔드는 단일 프로세스 uvicorn을 CPU 수만큼(지금 2개) 띄운다. Caddy가 웹소켓을 노트 경로로
  # 나눠(uri_hash) 같은 장의 연결이 한 프로세스에 모이고, 방 안 전달은 메모리에서 끝난다(daypage/hub.py).
  # 늘리려면 backend3…을 같은 모양으로 더하고 deploy/Caddyfile의 upstream 목록에도 넣는다.
  # 명령은 한 줄로 쓴다. YAML 접힘(>)에서 더 들여 쓴 줄은 줄바꿈이 남아 첫 줄만 실행됐었다.
  backend:
    <<: *backend
    # 수용 인원은 이 CPU 제한에서 계산한다(daypage/admission.py). 백엔드를 늘리면 같은 제한을 함께 준다.
    cpus: "1"
    mem_limit: 1152m
    # migrate는 배포 스크립트가 먼저 따로 돌린다(deploy/deploy.sh). 여기서는 받기만 한다.
    # 내릴 때(SIGTERM) 새 연결을 받지 않고 열린 연결을 정리할 시간을 준다. 그동안 Caddy가 다른 쪽으로 보낸다.
    command: &backend-command ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*", "--timeout-graceful-shutdown", "10"]
    stop_grace_period: 20s
    # 소켓이 열린 것만이 아니라 Django가 실제로 답하는지 본다(ALLOWED_HOSTS의 첫 도메인을 Host로 보낸다).
    healthcheck: &backend-health
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as u; h = os.environ.get('DJANGO_ALLOWED_HOSTS', 'localhost').split(',')[0]; u.urlopen(u.Request('http://127.0.0.1:8000/api/health', headers={'Host': h}), timeout=2)"
      # 검사마다 Python을 새로 띄워 CPU를 0.3초쯤 쓴다. 평소에는 드물게 보고,
      # 뜨는 동안(start_period)에만 촘촘히 봐서 배포(deploy.sh)가 빨리 healthy를 알아챈다.
      interval: 30s
      start_period: 120s
      start_interval: 2s
      retries: 3

  backend2:
    <<: *backend
    cpus: "1"
    mem_limit: 1152m
    command: *backend-command
    stop_grace_period: 20s
    healthcheck: *backend-health
    # 처음 띄울 때 backend가 먼저 받기 시작한 뒤에 뜬다(배포 때는 deploy.sh가 하나씩 바꾼다).
    depends_on:
      backend:
        condition: service_healthy

  worker:
    <<: *backend
    cpus: "0.05"
    mem_limit: 384m
    command: celery -A config worker -l info --concurrency 2

  beat:
    <<: *backend
    cpus: "0.03"
    mem_limit: 192m
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  postgres:
    image: postgres:17-alpine
    cpus: "0.55"
    mem_limit: 1152m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daypage}
      POSTGRES_USER: ${POSTGRES_USER:-daypage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-daypage}"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    cpus: "0.15"
    mem_limit: 192m
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  web_static:
  caddy_etc:
