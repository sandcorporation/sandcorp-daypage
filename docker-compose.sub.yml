# sub 서버용 덮어쓰기. sub의 80·443은 NPMplus(Nginx Proxy Manager)가 쓰고 TLS도 거기서 끝난다.
# Caddy는 HTTP로만 받고 127.0.0.1에만 묶어, NPMplus가
#   daypage.sandcorp.co.kr → http://127.0.0.1:${HTTP_PORT} (웹소켓 허용)
# 로 넘겨주게 한다.
services:
  web:
    environment:
      SITE_ADDRESS: ":80"
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-18090}:80"
