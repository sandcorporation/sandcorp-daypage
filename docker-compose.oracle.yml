# oracle 서버용 덮어쓰기. oracle의 80·443은 NPMplus(Nginx Proxy Manager)가 쓰고 TLS도 거기서 끝난다.
# Caddy는 HTTP로만 받고 docker 브리지 게이트웨이(172.17.0.1)에만 묶는다. 외부에는 열리지 않고,
# NPMplus 프록시 호스트가 daypage.sandcorp.co.kr → http://172.17.0.1:${HTTP_PORT} (웹소켓 허용)로 넘긴다.
#
# oracle에서는 빌드 컨테이너의 브리지 DNS가 풀리지 않는다(EAI_AGAIN). 빌드만 host 네트워크로 돌린다.
# (Jenkins 배포는 이미지를 ghcr에서 pull만 하므로 이 빌드 설정은 make prod-local 같은 직접 빌드에만 쓰인다. #99)
services:
  backend:
    build:
      context: ./backend
      network: host

  web-dist:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      network: host

  web:
    environment:
      SITE_ADDRESS: ":80"
    ports: !override
      - "${HTTP_BIND:-172.17.0.1}:${HTTP_PORT:-18090}:80"
