# 로컬 개발용 인프라. 백엔드·프론트 개발 서버는 호스트에서 실행한다.
services:
  postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: daypage
      POSTGRES_USER: daypage
      POSTGRES_PASSWORD: daypage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daypage"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "6379:6379"

volumes:
  pgdata:
