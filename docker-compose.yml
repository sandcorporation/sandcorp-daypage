# 로컬 개발용 인프라. 백엔드·프론트 개발 서버는 호스트에서 실행한다.
services:
  postgres:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_DB: daypage
      POSTGRES_USER: daypage
      POSTGRES_PASSWORD: daypage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daypage"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "6379:6379"

volumes:
  pgdata:
