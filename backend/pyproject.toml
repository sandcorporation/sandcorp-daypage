[project]
name = "daypage-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.118",
    "celery>=5.6.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=5.2,<6",
    "django-ninja>=1.7.1",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pycrdt>=0.14.8",
    "pycrdt-websocket>=0.16.5",
    "redis>=8.1.0",
    "sentry-sdk[celery,django]>=2.72.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "daphne>=4.2.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# 린트는 시험의 고정 대기만 막는다(다른 규칙은 켜지 않는다). 실행: uv run ruff check
[tool.ruff]
target-version = "py314"
include = ["tests/**/*.py"]  # 운영 코드(daypage/)의 sleep 은 대상이 아니다

[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "시험은 시간으로 기다리지 않는다 — 사건(asyncio.Event·timeout 있는 받기)이나 tests/waiting.py 의 until 로 기다린다."
"asyncio.sleep".msg = "시험은 시간으로 기다리지 않는다 — 사건(asyncio.Event·timeout 있는 받기)이나 tests/waiting.py 의 until 로 기다린다. 정말 필요하면 줄 끝에 사유와 함께 # noqa: TID251."
