<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 홈 화면에 추가(PWA): 아이패드·안드로이드에서 주소창 없이 앱처럼 열린다. 서비스 워커는 두지 않는다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Daypage" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 첫 화면에 안 쓰는 편집기 글꼴(감자꽃·하이멜로디·나눔명조)만 외부에서 받는다. 화면 그리기를 막지 않게 print로 받고 로드되면 켠다.
         첫 화면 글꼴(Gothic A1·Nanum Pen Script·Gaegu)은 직접 호스팅(src/fonts.css)이다(#73). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Hi+Melody&family=Nanum+Myeongjo:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Hi+Melody&family=Nanum+Myeongjo:wght@400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Daypage</title>
    <!-- 링크 공유 카드. 모든 경로가 이 파일을 받으므로 공유 노트 링크에도 일반 문구만 나간다(노트 제목·내용은 넣지 않는다). -->
    <meta name="description" content="링크 하나로 여러 사람이 같은 페이지에 실시간으로 그리고 쓰는 협업 노트" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daypage" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://daypage.sandcorp.co.kr/" />
    <meta property="og:title" content="Daypage" />
    <meta property="og:description" content="링크 하나로 여러 사람이 같은 페이지에 실시간으로 그리고 쓰는 협업 노트" />
    <meta property="og:image" content="https://daypage.sandcorp.co.kr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Daypage — 링크 하나로 여러 사람이 같은 페이지에 실시간으로 그리고 쓰는 협업 노트" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daypage" />
    <meta name="twitter:description" content="링크 하나로 여러 사람이 같은 페이지에 실시간으로 그리고 쓰는 협업 노트" />
    <meta name="twitter:image" content="https://daypage.sandcorp.co.kr/og-image.png" />
  </head>
  <body>
    <!-- 크롤러용 정적 footer(#97): React가 마운트하면 #root 안이 통째로 대체된다. 공개 홈의 footer는 HomePage.tsx에서 같은 링크를 그린다. -->
    <div id="root">
      <p style="margin:0;padding:24px;text-align:center;font:13px/1.4 system-ui,sans-serif;color:#5e6270">
        <a href="https://sandcorp.co.kr/?utm_source=daypage&amp;utm_medium=footer" style="color:inherit">Made by Sandcorp</a>
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
